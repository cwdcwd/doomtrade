<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoomTrade Dashboard</title>
  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.3/bundles/datastar.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --blue: #58a6ff;
      --yellow: #d29922;
      --purple: #bc8cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .mode-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .mode-sim { background: var(--yellow); color: #000; }
    .mode-live { background: var(--red); color: #fff; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .card-value { font-size: 28px; font-weight: 700; }
    .card-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; text-transform: uppercase; }
    td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    tr:hover { background: rgba(255,255,255,0.03); }
    .section { margin-bottom: 32px; }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .rationale { color: var(--muted); font-style: italic; font-size: 13px; }
    .confidence { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .conf-high { background: rgba(63,185,80,0.2); color: var(--green); }
    .conf-med { background: rgba(210,153,34,0.2); color: var(--yellow); }
    .conf-low { background: rgba(248,81,73,0.2); color: var(--red); }
    .status-filled { color: var(--green); }
    .status-rejected { color: var(--red); }
    .status-pending { color: var(--yellow); }
    #equity-chart { width: 100%; height: 200px; }
    .empty { color: var(--muted); padding: 24px; text-align: center; }
    .agent-tag { color: var(--purple); font-size: 12px; }
    .refresh-indicator { font-size: 12px; color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 4px; }
    .dot-error { background: var(--red); }
    /* Themes dashboard */
    .theme-card { cursor: pointer; transition: border-color 0.2s; }
    .theme-card:hover { border-color: var(--blue); }
    .theme-strategy-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: rgba(88,166,255,0.15); color: var(--blue); }
    .theme-status-active { color: var(--green); }
    .theme-status-paused { color: var(--yellow); }
    .theme-status-stopped { color: var(--muted); }
    .theme-detail { margin-top: 12px; }
    .theme-detail table { font-size: 13px; }
    .audit-step { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .audit-arrow { color: var(--muted); font-size: 12px; }
    .audit-signal { color: var(--blue); }
    .audit-decision { color: var(--purple); }
    .audit-trade { color: var(--green); }
    .theme-comparison-chart { width: 100%; height: 160px; }
    .theme-tab { display: inline-block; padding: 4px 12px; border-radius: 4px 4px 0 0; background: var(--card); border: 1px solid var(--border); border-bottom: none; cursor: pointer; font-size: 13px; }
    .theme-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .theme-tab-content { display: none; }
    .theme-tab-content.active { display: block; }
  </style>
</head>
<body>
  <!-- Scalar signals managed by Datastar mergePatch -->
  <div data-signals="{mode: '...', equity: '...', cash: '...', positionsValue: '...', pnlTotal: '...', pnlPct: '...', exposure: '...', positionCount: '...', lastUpdate: '...'}">

  <!-- Header -->
  <div class="header">
    <div>
      <h1>DoomTrade</h1>
      <div class="refresh-indicator">
        <span class="dot" id="status-dot"></span>
        <span data-text="$lastUpdate">Loading...</span>
      </div>
    </div>
    <div data-show="$mode === 'live'">
      <span class="mode-badge mode-live">LIVE</span>
    </div>
    <div data-show="$mode !== 'live'">
      <span class="mode-badge mode-sim">SIM</span>
    </div>
  </div>

  <!-- Portfolio Summary -->
  <div class="grid">
    <div class="card">
      <div class="card-label">Equity</div>
      <div class="card-value" data-text="'$' + $equity"></div>
    </div>
    <div class="card">
      <div class="card-label">Cash</div>
      <div class="card-value" data-text="'$' + $cash"></div>
    </div>
    <div class="card">
      <div class="card-label">Positions Value</div>
      <div class="card-value" data-text="'$' + $positionsValue"></div>
      <div class="card-sub" data-text="$positionCount + ' open'"></div>
    </div>
    <div class="card">
      <div class="card-label">Total P&L</div>
      <div class="card-value" data-text="'$' + $pnlTotal" data-class:positive="$pnlPct >= 0" data-class:negative="$pnlPct < 0"></div>
      <div class="card-sub" data-text="($pnlPct + '%')" data-class:positive="$pnlPct >= 0" data-class:negative="$pnlPct < 0"></div>
    </div>
    <div class="card">
      <div class="card-label">Exposure</div>
      <div class="card-value" data-text="$exposure + '%'"></div>
    </div>
  </div>

  <!-- Equity Chart -->
  <div class="section">
    <div class="section-title">Equity Curve</div>
    <div class="card">
      <canvas id="equity-chart"></canvas>
    </div>
  </div>

  <!-- Open Positions -->
  <div class="section">
    <div class="section-title">Open Positions</div>
    <div class="card">
      <div id="positions-container">
        <div class="empty">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Recent Decisions -->
  <div class="section">
    <div class="section-title">Recent Decisions</div>
    <div class="card">
      <div id="decisions-container">
        <div class="empty">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Recent Trades -->
  <div class="section">
    <div class="section-title">Recent Trades</div>
    <div class="card">
      <div id="trades-container">
        <div class="empty">Loading...</div>
      </div>
    </div>
  </div>

  <!-- ── Themes Dashboard ─────────────────────────────────────── -->
  <div class="section">
    <div class="section-title">Experimental Themes — Comparison</div>
    <div class="card">
      <div id="themes-comparison-container">
        <div class="empty">Loading themes...</div>
      </div>
    </div>
    <div class="card" style="margin-top: 12px;">
      <canvas id="theme-comparison-chart" class="theme-comparison-chart"></canvas>
    </div>
  </div>

  <!-- Themes Detail / Audit Trail -->
  <div class="section">
    <div class="section-title">Theme Audit Trail</div>
    <div class="card">
      <div id="themes-tabs-container">
        <div class="empty">Loading...</div>
      </div>
      <div id="themes-detail-container" style="margin-top: 12px;">
        <div class="empty">Select a theme to view its audit trail.</div>
      </div>
    </div>
  </div>

  </div>

  <script type="module">
    // Import Datastar's mergePatch for proper signal updates
    import { mergePatch } from "https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.3/bundles/datastar.js";

    // ── XSS-safe HTML escaping ──────────────────────────────────────
    // All dynamic text from the API is passed through this before
    // being inserted into innerHTML.  This prevents script injection
    // via agent rationale, symbol names, or any other string field.
    function esc(value) {
      if (value == null) return '';
      const div = document.createElement('div');
      div.textContent = String(value);
      return div.innerHTML;
    }

    // ── Polling fetch + signal update ───────────────────────────────
    async function fetchDashboard() {
      const statusDot = document.getElementById('status-dot');
      try {
        const [portResp, posResp, decResp, tradeResp, histResp] = await Promise.all([
          fetch('/api/portfolio'),
          fetch('/api/positions'),
          fetch('/api/decisions?limit=10'),
          fetch('/api/trades?limit=10'),
          fetch('/api/portfolio/history'),
        ]);

        const port = await portResp.json();
        const pos = await posResp.json();
        const dec = await decResp.json();
        const trades = await tradeResp.json();
        const hist = await histResp.json();

        // Update scalar signals via Datastar's mergePatch API
        // (replaces the broken setAttribute('data-signals:…') approach)
        mergePatch({
          mode: port.mode || 'sim',
          equity: (port.portfolio?.equity || 0).toFixed(2),
          cash: (port.portfolio?.cash || 0).toFixed(2),
          positionsValue: (port.portfolio?.positionsValue || 0).toFixed(2),
          pnlTotal: (port.pnl?.total || 0).toFixed(2),
          pnlPct: (port.pnl?.totalPct || 0).toFixed(2),
          exposure: (port.portfolio?.exposurePct || 0).toFixed(2),
          positionCount: port.portfolio?.positionCount || 0,
          lastUpdate: new Date().toLocaleTimeString(),
        });

        // Render table sections via direct DOM manipulation (innerHTML
        // with escaped content — NOT via Datastar data-text which only
        // sets textContent and would show raw HTML as literal text)
        document.getElementById('positions-container').innerHTML =
          renderPositions(pos.positions || []);
        document.getElementById('decisions-container').innerHTML =
          renderDecisions(dec.decisions || []);
        document.getElementById('trades-container').innerHTML =
          renderTrades(trades.trades || []);

        // Draw equity chart on canvas
        drawEquityChart(hist.history || []);

        statusDot.classList.remove('dot-error');
      } catch (e) {
        console.error('Dashboard fetch error:', e);
        mergePatch({ lastUpdate: 'Error: ' + e.message });
        statusDot.classList.add('dot-error');
      }
    }

    // ── Table renderers (all dynamic values escaped via esc()) ──────

    function renderPositions(positions) {
      if (!positions.length) return '<div class="empty">No open positions</div>';
      let html = '<table><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th><th>Current</th><th>P&amp;L</th></tr>';
      for (const p of positions) {
        const pnl = p.unrealizedPnl || 0;
        const pnlClass = pnl >= 0 ? 'positive' : 'negative';
        const pnlSign = pnl >= 0 ? '+' : '';
        html += '<tr>'
          + '<td><strong>' + esc(p.symbol) + '</strong></td>'
          + '<td>' + esc(p.side) + '</td>'
          + '<td>' + esc(p.quantity) + '</td>'
          + '<td>$' + Number(p.avgEntryPrice || 0).toFixed(2) + '</td>'
          + '<td>$' + Number(p.currentPrice || p.avgEntryPrice || 0).toFixed(2) + '</td>'
          + '<td class="' + pnlClass + '">' + pnlSign + '$' + pnl.toFixed(2) + '</td>'
          + '</tr>';
      }
      html += '</table>';
      return html;
    }

    function renderDecisions(decisions) {
      if (!decisions.length) return '<div class="empty">No decisions yet</div>';
      let html = '<table><tr><th>Time</th><th>Agent</th><th>Action</th><th>Symbol</th><th>Qty</th><th>Price</th><th>Conf</th><th>Rationale</th></tr>';
      for (const d of decisions) {
        const time = new Date(d.timestamp).toLocaleTimeString();
        const conf = d.confidence || 0;
        const confClass = conf >= 7 ? 'conf-high' : conf >= 4 ? 'conf-med' : 'conf-low';
        html += '<tr>'
          + '<td>' + esc(time) + '</td>'
          + '<td class="agent-tag">' + esc(d.agent) + '</td>'
          + '<td><strong>' + esc(d.action).toUpperCase() + '</strong></td>'
          + '<td>' + esc(d.symbol) + '</td>'
          + '<td>' + esc(d.quantity) + '</td>'
          + '<td>$' + Number(d.priceAtDecision || 0).toFixed(2) + '</td>'
          + '<td><span class="confidence ' + confClass + '">' + conf + '/10</span></td>'
          + '<td class="rationale">' + esc(d.rationale) + '</td>'
          + '</tr>';
      }
      html += '</table>';
      return html;
    }

    function renderTrades(trades) {
      if (!trades.length) return '<div class="empty">No trades yet</div>';
      let html = '<table><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Fill</th><th>Fee</th><th>Status</th></tr>';
      for (const t of trades) {
        const time = new Date(t.timestamp).toLocaleTimeString();
        const statusClass = 'status-' + (t.status || 'pending');
        html += '<tr>'
          + '<td>' + esc(time) + '</td>'
          + '<td><strong>' + esc(t.symbol) + '</strong></td>'
          + '<td>' + esc(t.side).toUpperCase() + '</td>'
          + '<td>' + esc(t.quantity) + '</td>'
          + '<td>$' + Number(t.fillPrice || 0).toFixed(2) + '</td>'
          + '<td>$' + Number(t.fee || 0).toFixed(2) + '</td>'
          + '<td class="' + esc(statusClass) + '">' + esc(t.status) + '</td>'
          + '</tr>';
      }
      html += '</table>';
      return html;
    }

    function drawEquityChart(points) {
      if (!points || points.length < 2) return;
      const canvas = document.getElementById('equity-chart');
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.offsetWidth;
      const h = canvas.height = 200;

      const values = points.map(p => p.equity || p.value || 0);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;

      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 1;
      // Grid lines
      for (let i = 0; i <= 4; i++) {
        const y = (h / 4) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // Equity line
      ctx.strokeStyle = '#58a6ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < values.length; i++) {
        const x = (w / (values.length - 1)) * i;
        const y = h - ((values[i] - min) / range) * (h - 20) - 10;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Fill under line
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fillStyle = 'rgba(88, 166, 255, 0.1)';
      ctx.fill();

      // Labels
      ctx.fillStyle = '#8b949e';
      ctx.font = '11px sans-serif';
      ctx.fillText('$' + max.toFixed(0), 4, 14);
      ctx.fillText('$' + min.toFixed(0), 4, h - 4);
    }

    // Initial fetch + poll
    fetchDashboard();
    fetchThemes();
    setInterval(fetchDashboard, 5000);
    setInterval(fetchThemes, 10000);

    // ── Themes Dashboard ────────────────────────────────────────

    let themesCache = [];
    let activeThemeTab = null;

    async function fetchThemes() {
      try {
        const themesResp = await fetch('/api/themes?limit=50');
        if (!themesResp.ok) {
          document.getElementById('themes-comparison-container').innerHTML =
            '<div class="empty">Themes API not available</div>';
          return;
        }
        const themesData = await themesResp.json();
        const themes = themesData.themes || [];
        themesCache = themes;

        // Render comparison table
        document.getElementById('themes-comparison-container').innerHTML =
          renderThemesComparison(themes);

        // Render tabs
        document.getElementById('themes-tabs-container').innerHTML =
          renderThemeTabs(themes);

        // Fetch performance for each theme in parallel
        const perfResults = await Promise.allSettled(
          themes.map(t => fetchThemePerformance(t.id))
        );
        const performances = perfResults.map((r, i) =>
          r.status === 'fulfilled' ? r.value : null
        );

        // Update comparison table with P&L data
        updateComparisonWithPerf(themes, performances);

        // Draw comparison chart
        drawThemeComparisonChart(themes, performances);

        // If active tab is set, re-render its detail
        if (activeThemeTab) {
          const perf = performances[themes.findIndex(t => t.id === activeThemeTab)];
          renderThemeDetail(activeThemeTab, perf);
        }
      } catch (e) {
        console.error('Themes fetch error:', e);
        document.getElementById('themes-comparison-container').innerHTML =
          '<div class="empty">Error loading themes: ' + esc(e.message) + '</div>';
      }
    }

    async function fetchThemePerformance(themeId) {
      const resp = await fetch('/api/themes/' + encodeURIComponent(themeId) + '/performance');
      if (!resp.ok) return null;
      const data = await resp.json();
      return data.performance || null;
    }

    async function fetchThemeEvaluations(themeId) {
      const resp = await fetch('/api/themes/' + encodeURIComponent(themeId) + '/evaluations?limit=20');
      if (!resp.ok) return [];
      const data = await resp.json();
      return data.evaluations || [];
    }

    function renderThemesComparison(themes) {
      if (!themes.length) return '<div class="empty">No themes configured. Create one via POST /api/themes</div>';
      let html = '<table><tr><th>Name</th><th>Strategy</th><th>Mode</th><th>Status</th><th>Capital</th><th>P&amp;L</th><th>DD%</th><th>Trades</th><th>Positions</th></tr>';
      for (const t of themes) {
        const status = t.enabled ? 'active' : 'stopped';
        const statusClass = 'theme-status-' + status;
        html += '<tr class="theme-card" id="theme-row-' + esc(t.id) + '" onclick="selectTheme(\'' + esc(t.id) + '\')">'
          + '<td><strong>' + esc(t.name) + '</strong></td>'
          + '<td><span class="theme-strategy-tag">' + esc(t.strategy) + '</span></td>'
          + '<td>' + esc(t.mode).toUpperCase() + '</td>'
          + '<td class="' + statusClass + '">' + status.toUpperCase() + '</td>'
          + '<td>$' + Number(t.allocatedCapital || 0).toFixed(0) + '</td>'
          + '<td id="theme-pnl-' + esc(t.id) + '">—</td>'
          + '<td id="theme-dd-' + esc(t.id) + '">—</td>'
          + '<td id="theme-trades-' + esc(t.id) + '">—</td>'
          + '<td id="theme-positions-' + esc(t.id) + '">—</td>'
          + '</tr>';
      }
      html += '</table>';
      return html;
    }

    function updateComparisonWithPerf(themes, performances) {
      for (let i = 0; i < themes.length; i++) {
        const perf = performances[i];
        const id = themes[i].id;
        if (!perf) continue;

        const pnl = perf.realizedPnl || 0;
        const pnlClass = pnl >= 0 ? 'positive' : 'negative';
        const pnlEl = document.getElementById('theme-pnl-' + id);
        if (pnlEl) pnlEl.innerHTML = '<span class="' + pnlClass + '">' + (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2) + '</span>';

        const ddEl = document.getElementById('theme-dd-' + id);
        if (ddEl) ddEl.textContent = (perf.drawdownPct || 0).toFixed(1) + '%';

        const tradesEl = document.getElementById('theme-trades-' + id);
        if (tradesEl) tradesEl.textContent = (perf.filledTrades || 0) + '/' + (perf.totalTrades || 0);

        const posEl = document.getElementById('theme-positions-' + id);
        if (posEl) posEl.textContent = perf.openPositions || 0;
      }
    }

    function renderThemeTabs(themes) {
      if (!themes.length) return '<div class="empty">No themes</div>';
      return themes.map(t =>
        '<span class="theme-tab" id="theme-tab-' + esc(t.id) + '" onclick="selectTheme(\'' + esc(t.id) + '\')">' + esc(t.name) + '</span>'
      ).join(' ');
    }

    window.selectTheme = async function(themeId) {
      activeThemeTab = themeId;

      // Update tab highlighting
      document.querySelectorAll('.theme-tab').forEach(el => el.classList.remove('active'));
      const tab = document.getElementById('theme-tab-' + themeId);
      if (tab) tab.classList.add('active');

      // Fetch performance + evaluations
      const perf = await fetchThemePerformance(themeId);
      renderThemeDetail(themeId, perf);
    };

    async function renderThemeDetail(themeId, perf) {
      const container = document.getElementById('themes-detail-container');
      if (!container) return;

      const evaluations = await fetchThemeEvaluations(themeId);
      const theme = themesCache.find(t => t.id === themeId);
      if (!theme) {
        container.innerHTML = '<div class="empty">Theme not found</div>';
        return;
      }

      let html = '<div class="theme-detail">';

      // Performance summary
      if (perf) {
        html += '<table style="margin-bottom:16px;">'
          + '<tr><th>Starting Balance</th><th>Current Balance</th><th>Peak</th><th>Drawdown</th><th>Realized P&amp;L</th><th>Win Rate</th></tr>'
          + '<tr>'
          + '<td>$' + (perf.startingBalance || 0).toFixed(2) + '</td>'
          + '<td>$' + (perf.currentBalance || 0).toFixed(2) + '</td>'
          + '<td>$' + (perf.peakBalance || 0).toFixed(2) + '</td>'
          + '<td>' + (perf.drawdownPct || 0).toFixed(1) + '%</td>'
          + '<td class="' + ((perf.realizedPnl || 0) >= 0 ? 'positive' : 'negative') + '">'
          + ((perf.realizedPnl || 0) >= 0 ? '+' : '') + '$' + (perf.realizedPnl || 0).toFixed(2) + '</td>'
          + '<td>' + ((perf.winRate || 0) * 100).toFixed(1) + '%</td>'
          + '</tr></table>';
      }

      // Evaluation history (audit trail)
      if (evaluations.length === 0) {
        html += '<div class="empty">No evaluations yet. Trigger one via POST /api/themes/' + esc(themeId) + '/evaluate</div>';
      } else {
        html += '<div class="section-title" style="font-size:14px;">Evaluation History (Audit Trail)</div>';
        html += '<table><tr><th>Timestamp</th><th>Signals</th><th>Decisions</th><th>Trades</th><th>Errors</th></tr>';
        for (const ev of evaluations) {
          const time = new Date(ev.timestamp).toLocaleString();
          const errors = ev.errors && ev.errors.length > 0
            ? '<span class="negative">' + ev.errors.length + ' error(s)</span>'
            : '<span class="positive">OK</span>';
          html += '<tr>'
            + '<td>' + esc(time) + '</td>'
            + '<td>' + (ev.signalsCount || 0) + '</td>'
            + '<td>' + (ev.decisionsCount || 0) + '</td>'
            + '<td>' + (ev.tradesCount || 0) + '</td>'
            + '<td>' + errors + '</td>'
            + '</tr>';
        }
        html += '</table>';
      }

      html += '</div>';
      container.innerHTML = html;
    }

    function drawThemeComparisonChart(themes, performances) {
      const canvas = document.getElementById('theme-comparison-chart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.offsetWidth;
      const h = 160;

      ctx.clearRect(0, 0, w, h);

      // Background grid
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 3; i++) {
        const y = (h / 3) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // Zero line
      const midY = h / 2;
      ctx.strokeStyle = '#30363d';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(0, midY);
      ctx.lineTo(w, midY);
      ctx.stroke();
      ctx.setLineDash([]);

      if (!themes.length || !performances.some(p => p)) return;

      // Compute P&L for each theme
      const pnls = themes.map((t, i) => {
        const perf = performances[i];
        return perf ? (perf.realizedPnl || 0) : 0;
      });

      const maxAbs = Math.max(...pnls.map(p => Math.abs(p)), 1);
      const barWidth = Math.min(60, (w - 40) / themes.length - 8);
      const gap = (w - 40) / themes.length;
      const colors = ['#58a6ff', '#3fb950', '#bc8cff', '#d29922', '#f85149', '#39c5cf'];

      for (let i = 0; i < themes.length; i++) {
        const x = 20 + gap * i + (gap - barWidth) / 2;
        const pnl = pnls[i];
        const barHeight = (Math.abs(pnl) / maxAbs) * (h / 2 - 20);
        const barY = pnl >= 0 ? midY - barHeight : midY;

        ctx.fillStyle = pnl >= 0 ? colors[i % colors.length] : '#f85149';
        ctx.fillRect(x, barY, barWidth, barHeight);

        // Label
        ctx.fillStyle = '#8b949e';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        const label = themes[i].name.length > 12
          ? themes[i].name.slice(0, 10) + '…'
          : themes[i].name;
        ctx.fillText(label, x + barWidth / 2, h - 4);
        ctx.textAlign = 'left';

        // P&L value
        ctx.fillStyle = pnl >= 0 ? '#3fb950' : '#f85149';
        ctx.font = '10px sans-serif';
        const pnlLabel = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(0);
        ctx.fillText(pnlLabel, x, barY - 4);
      }
    }
  </script>
</body>
