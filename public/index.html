<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoomTrade — Agent Trading Monitor</title>
  <style>
    :root {
      --bg: #0a0e14;
      --surface: #11161e;
      --surface2: #161c26;
      --border: #1e2632;
      --border-light: #2a3441;
      --text: #d4dae0;
      --muted: #6b7684;
      --dim: #4a5462;
      --green: #26d07c;
      --red: #f04444;
      --yellow: #f5a623;
      --purple: #b884ff;
      --cyan: #2dd4d4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .app { max-width: 1400px; margin: 0 auto; padding: 16px 20px 40px; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    .logo {
      font-size: 18px; font-weight: 700; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--green), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(38,208,124,0.4); }
    .dot.error { background: var(--red); box-shadow: 0 0 6px rgba(240,68,68,0.4); }
    .timestamp { font-size: 11px; color: var(--muted); }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    .badge-sim { background: rgba(245,166,35,0.12); color: var(--yellow); border: 1px solid rgba(245,166,35,0.25); }

    /* Toolbar */
    .toolbar { display: flex; gap: 8px; margin-bottom: 24px; align-items: center; }
    .btn {
      padding: 6px 14px; border-radius: 5px; font-size: 11px; font-weight: 600;
      border: 1px solid var(--border-light); background: var(--surface);
      color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .btn:hover { color: var(--text); border-color: var(--border-light); background: var(--surface2); }
    .btn:disabled { opacity: 0.4; cursor: wait; }
    .toolbar-spacer { flex: 1; }
    .toolbar-info { font-size: 11px; color: var(--dim); }

    /* Agent grid */
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 16px;
    }

    /* Agent card — always expanded */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
    }

    /* Card header */
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .card-head-left { display: flex; align-items: center; gap: 10px; }
    .rank {
      width: 22px; height: 22px; border-radius: 5px; display: flex;
      align-items: center; justify-content: center; font-size: 10px; font-weight: 700;
      background: var(--surface2); color: var(--muted); flex-shrink: 0;
    }
    .rank.r1 { background: rgba(245,166,35,0.15); color: var(--yellow); }
    .rank.r2 { background: rgba(173,173,173,0.12); color: #c0c0c0; }
    .rank.r3 { background: rgba(205,127,50,0.12); color: #cd7f32; }
    .agent-name { font-size: 14px; font-weight: 700; }
    .strategy-pill {
      font-size: 10px; padding: 2px 8px; border-radius: 10px;
      background: var(--surface2); color: var(--muted); margin-left: 6px;
    }
    .active-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .active-dot.on { background: var(--green); }
    .active-dot.off { background: var(--dim); }

    /* Equity section */
    .equity-row {
      display: flex; padding: 14px 16px; gap: 20px; border-bottom: 1px solid var(--border);
    }
    .equity-item { flex: 1; }
    .equity-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .equity-value { font-size: 18px; font-weight: 700; }
    .equity-sub { font-size: 12px; font-weight: 600; margin-top: 1px; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }

    /* Metrics bar */
    .metrics-bar {
      display: flex; padding: 8px 16px; gap: 16px; border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .metric-item { color: var(--muted); }
    .metric-item strong { color: var(--text); font-weight: 600; }

    /* Positions table */
    .section-head {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 10px 16px 6px;
    }
    .section-head::before {
      content: ''; display: inline-block; width: 3px; height: 10px;
      border-radius: 2px; background: var(--green); margin-right: 6px; vertical-align: middle;
    }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      text-align: left; padding: 4px 16px; color: var(--dim);
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border); font-weight: 600;
    }
    td { padding: 5px 16px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.015); }
    .empty { padding: 12px 16px; color: var(--dim); font-size: 11px; }
    .sym { font-weight: 700; }

    /* Trades */
    .side-buy { color: var(--green); font-weight: 600; }
    .side-sell { color: var(--red); font-weight: 600; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--surface); border: 1px solid var(--border-light);
      border-radius: 8px; padding: 10px 14px; font-size: 12px;
      max-width: 360px; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      opacity: 0; transform: translateY(20px); transition: all 0.2s; z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok { border-color: rgba(38,208,124,0.3); }
    .toast.err { border-color: rgba(240,68,68,0.3); }

    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    /* Market ticker */
    .market-bar {
      display: flex; gap: 0; overflow-x: auto; border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 20px; background: var(--surface);
    }
    .ticker-item {
      display: flex; flex-direction: column; padding: 8px 14px;
      border-right: 1px solid var(--border); white-space: nowrap; min-width: 110px;
    }
    .ticker-item:last-child { border-right: none; }
    .ticker-sym { font-size: 11px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .ticker-price { font-size: 13px; font-weight: 600; }
    .ticker-chg { font-size: 11px; font-weight: 600; }
    .ticker-rsi { font-size: 10px; color: var(--dim); margin-top: 1px; }
    .signal-tag {
      font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 700;
      text-transform: uppercase; display: inline-block; margin-left: 4px;
    }
    .sig-buy { background: rgba(38,208,124,0.15); color: var(--green); }
    .sig-sell { background: rgba(240,68,68,0.15); color: var(--red); }
    .sig-neutral { background: rgba(107,118,132,0.15); color: var(--muted); }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div>
      <div class="logo">DoomTrade</div>
      <div class="header-sub">Agent Trading Monitor</div>
    </div>
    <div class="header-right">
      <span class="dot" id="dot"></span>
      <span class="timestamp" id="ts">Connecting…</span>
      <span class="badge badge-sim" id="mode">SIM</span>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <span class="toolbar-info" style="font-size:11px;color:var(--yellow)" title="Fleet agents (Doom, Kangbot, ThanosBot) trade on their own cron schedules — this dashboard is a read-only viewer">👀 Read-only monitor — trading runs on the fleet's cron cycles</span>
    <div class="toolbar-spacer"></div>
    <span class="toolbar-info" id="info"></span>
  </div>

  <!-- Market ticker -->
  <div class="market-bar" id="market-bar">
    <div style="color:var(--dim);padding:10px 14px;font-size:11px">Loading market data…</div>
  </div>

  <!-- Agent grid -->
  <div class="grid" id="grid">
    <div style="color:var(--muted);padding:48px;text-align:center;grid-column:1/-1">Loading agents…</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
