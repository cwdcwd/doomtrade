<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoomTrade — Agent Trading Dashboard</title>
  <style>
    :root {
      --bg: #0a0e14;
      --surface: #11161e;
      --surface2: #161c26;
      --border: #1e2632;
      --border-light: #2a3441;
      --text: #d4dae0;
      --muted: #6b7684;
      --dim: #4a5462;
      --green: #26d07c;
      --red: #f04444;
      --blue: #4c8dff;
      --yellow: #f5a623;
      --purple: #b884ff;
      --cyan: #2dd4d4;
      --accent: #26d07c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.5;
      padding: 0;
      min-height: 100vh;
    }
    .mono { font-family: inherit; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* ── Layout ───────────────────────────────── */
    .app { max-width: 1400px; margin: 0 auto; padding: 16px; }

    /* ── Header ───────────────────────────────── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo {
      font-size: 18px; font-weight: 700; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--green), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-sub { font-size: 11px; color: var(--muted); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 8px rgba(38,208,124,0.5);
    }
    .status-dot.error { background: var(--red); box-shadow: 0 0 8px rgba(240,68,68,0.5); }
    .last-update { font-size: 11px; color: var(--muted); }
    .mode-badge {
      padding: 3px 10px; border-radius: 4px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .mode-sim { background: rgba(245,166,35,0.15); color: var(--yellow); border: 1px solid rgba(245,166,35,0.3); }
    .mode-live { background: rgba(240,68,68,0.15); color: var(--red); border: 1px solid rgba(240,68,68,0.3); }

    /* ── Toolbar ──────────────────────────────── */
    .toolbar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn {
      padding: 7px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border-light); background: var(--surface);
      color: var(--text); cursor: pointer; transition: all 0.15s;
      font-family: inherit;
    }
    .btn:hover { background: var(--surface2); border-color: var(--accent); }
    .btn-primary { background: rgba(38,208,124,0.1); border-color: rgba(38,208,124,0.3); color: var(--green); }
    .btn-primary:hover { background: rgba(38,208,124,0.2); }
    .btn-danger { background: rgba(240,68,68,0.1); border-color: rgba(240,68,68,0.3); color: var(--red); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-loading { opacity: 0.6; pointer-events: none; }

    /* ── Agent Cards ──────────────────────────── */
    .agents-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .agent-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; transition: border-color 0.2s;
    }
    .agent-card:hover { border-color: var(--border-light); }
    .agent-card.expanded { border-color: rgba(38,208,124,0.2); }
    .agent-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; cursor: pointer; user-select: none;
    }
    .agent-name-row { display: flex; align-items: center; gap: 10px; }
    .agent-rank {
      width: 24px; height: 24px; border-radius: 6px; display: flex;
      align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
      background: var(--surface2); color: var(--muted);
    }
    .agent-rank.rank-1 { background: rgba(245,166,35,0.15); color: var(--yellow); }
    .agent-rank.rank-2 { background: rgba(173,173,173,0.15); color: #c0c0c0; }
    .agent-rank.rank-3 { background: rgba(205,127,50,0.15); color: #cd7f32; }
    .agent-name { font-size: 14px; font-weight: 700; }
    .agent-strategy { font-size: 11px; color: var(--muted); }
    .agent-stats { display: flex; gap: 16px; align-items: center; }
    .agent-stat { text-align: right; }
    .agent-stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
    .agent-stat-value { font-size: 15px; font-weight: 700; }
    .agent-pnl { font-size: 12px; font-weight: 600; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .neutral { color: var(--muted); }

    .agent-body {
      display: none; padding: 0 16px 16px;
      border-top: 1px solid var(--border);
    }
    .agent-card.expanded .agent-body { display: block; }

    .agent-metrics {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin: 12px 0;
    }
    .metric {
      background: var(--surface2); border-radius: 6px; padding: 8px 10px;
    }
    .metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
    .metric-value { font-size: 13px; font-weight: 600; }

    /* ── Mini Table ───────────────────────────── */
    .mini-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    .mini-table th {
      text-align: left; padding: 6px 8px; color: var(--muted);
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    .mini-table td {
      padding: 6px 8px; border-bottom: 1px solid var(--border);
    }
    .mini-table tr:hover { background: rgba(255,255,255,0.02); }
    .mini-table .empty-row { color: var(--dim); text-align: center; padding: 16px; }

    .sub-section-title {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px; margin-top: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .sub-section-title::before {
      content: ''; width: 3px; height: 12px; border-radius: 2px; background: var(--accent);
    }

    /* ── Agent Action Bar ─────────────────────── */
    .agent-actions { display: flex; gap: 6px; margin-top: 10px; }
    .btn-sm {
      padding: 4px 10px; font-size: 11px; border-radius: 4px;
      border: 1px solid var(--border-light); background: var(--surface2);
      color: var(--text); cursor: pointer; transition: all 0.15s;
      font-family: inherit; font-weight: 600;
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Toast ────────────────────────────────── */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--surface); border: 1px solid var(--border-light);
      border-radius: 8px; padding: 12px 16px; font-size: 12px;
      max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transform: translateY(100px); opacity: 0; transition: all 0.3s;
      z-index: 1000;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(38,208,124,0.3); }
    .toast.error { border-color: rgba(240,68,68,0.3); }

    /* ── Equity Sparkline ─────────────────────── */
    .sparkline { width: 60px; height: 20px; display: inline-block; vertical-align: middle; }

    /* ── Responsive ───────────────────────────── */
    @media (max-width: 900px) {
      .agents-grid { grid-template-columns: 1fr; }
      .agent-metrics { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div>
        <div class="logo">DoomTrade</div>
        <div class="header-sub">Agent Trading Platform</div>
      </div>
    </div>
    <div class="header-right">
      <span class="status-dot" id="status-dot"></span>
      <span class="last-update" id="last-update">Connecting…</span>
      <span class="mode-badge mode-sim" id="mode-badge">SIM</span>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn btn-primary" id="btn-a2a" onclick="runA2ACycle()">⚡ Run A2A Cycle</button>
    <button class="btn" id="btn-eval-all" onclick="evaluateAllAgents()">▶ Evaluate All</button>
    <button class="btn" onclick="fetchDashboard()">↻ Refresh</button>
    <span style="flex:1"></span>
    <span style="font-size:11px;color:var(--muted);align-self:center" id="health-info"></span>
  </div>

  <!-- Agent Cards Grid -->
  <div class="agents-grid" id="agents-grid">
    <div style="color:var(--muted);padding:40px;text-align:center;grid-column:1/-1">Loading agents…</div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API = '';
let dashboardData = {};
let expandedAgent = null;

// ── XSS-safe escape ──────────────────────────────
function esc(v) {
  if (v == null) return '';
  const d = document.createElement('div');
  d.textContent = String(v);
  return d.innerHTML;
}

// ── Toast ────────────────────────────────────────
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── API helpers ──────────────────────────────────
function authHeaders() {
  const h = {};
  if (window.DOOMTRADE_API_KEY) h['Authorization'] = 'Bearer ' + window.DOOMTRADE_API_KEY;
  return h;
}

async function api(path, method) {
  const resp = await fetch(API + path, { method: method || 'GET', headers: authHeaders() });
  return resp;
}

async function apiJSON(path) {
  const resp = await fetch(API + path, { headers: authHeaders() });
  if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
  return resp.json();
}

// ── Number formatting ────────────────────────────
function fmtMoney(v) {
  const n = Number(v || 0);
  return '$' + n.toFixed(2);
}
function fmtPct(v) {
  const n = Number(v || 0);
  const sign = n >= 0 ? '+' : '';
  return sign + n.toFixed(2) + '%';
}
function pnlClass(v) { return v >= 0 ? 'positive' : 'negative'; }

// ── Fetch all dashboard data ─────────────────────
async function fetchDashboard() {
  const dot = document.getElementById('status-dot');
  try {
    const [health, agentsResp, leaderResp] = await Promise.all([
      apiJSON('/api/health'),
      apiJSON('/api/agents'),
      apiJSON('/api/agents/leaderboard'),
    ]);

    const agents = agentsResp.agents || [];
    const leaderboard = leaderResp.leaderboard || [];
    const rankMap = {};
    leaderboard.forEach(e => rankMap[e.name] = e.rank);

    // Fetch per-agent details in parallel
    const details = await Promise.all(
      agents.map(async a => {
        try {
          const [port, pos, trd, ana] = await Promise.all([
            apiJSON(`/api/agents/${a.id}/portfolio`),
            apiJSON(`/api/agents/${a.id}/positions`),
            apiJSON(`/api/agents/${a.id}/trades?limit=5`),
            apiJSON(`/api/agents/${a.id}/analytics`),
          ]);
          return { agent: a, portfolio: port, positions: pos, trades: trd, analytics: ana, rank: rankMap[a.name] || '-' };
        } catch (e) {
          return { agent: a, portfolio: null, positions: null, trades: null, analytics: null, rank: rankMap[a.name] || '-' };
        }
      })
    );

    dashboardData = { health, agents: details, leaderboard };
    renderDashboard();
    dot.classList.remove('error');
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
    document.getElementById('mode-badge').textContent = (health.mode || 'sim').toUpperCase();
    document.getElementById('mode-badge').className = 'mode-badge ' + (health.mode === 'live' ? 'mode-live' : 'mode-sim');
    document.getElementById('health-info').textContent = `uptime ${Math.round(health.uptime || 0)}s`;
  } catch (e) {
    console.error('Dashboard fetch error:', e);
    dot.classList.add('error');
    document.getElementById('last-update').textContent = 'Error: ' + e.message;
  }
}

// ── Render ───────────────────────────────────────
function renderDashboard() {
  const grid = document.getElementById('agents-grid');
  const agents = dashboardData.agents || [];
  if (!agents.length) {
    grid.innerHTML = '<div style="color:var(--muted);padding:40px;text-align:center;grid-column:1/-1">No agents registered</div>';
    return;
  }
  grid.innerHTML = agents.map(d => renderAgentCard(d)).join('');
}

function renderAgentCard(d) {
  const a = d.agent;
  const port = d.portfolio?.portfolio || {};
  const equity = port.equity || a.equity || a.cash || 0;
  const cash = port.cash ?? a.cash ?? 0;
  const initBal = a.initialBalance || a.starting_balance || 100;
  const pnl = equity - initBal;
  const retPct = ((pnl / initBal) * 100);
  const positions = d.positions?.positions || [];
  const trades = d.trades?.trades || [];
  const analytics = d.analytics?.analytics || {};
  const rank = d.rank;
  const rankClass = rank <= 3 ? `rank-${rank}` : '';
  const isActive = a.active;
  const expanded = expandedAgent === a.id ? 'expanded' : '';

  let html = `<div class="agent-card ${expanded}" id="card-${a.id}">`;

  // Header row
  html += `<div class="agent-header" onclick="toggleAgent('${a.id}')">`;
  html += `<div class="agent-name-row">`;
  html += `<div class="agent-rank ${rankClass}">${esc(rank)}</div>`;
  html += `<div>`;
  html += `<div class="agent-name">${esc(a.name)}</div>`;
  html += `<div class="agent-strategy">${esc(a.strategy || '—')}</div>`;
  html += `</div></div>`;
  html += `<div class="agent-stats">`;
  html += `<div class="agent-stat"><div class="agent-stat-label">Equity</div><div class="agent-stat-value">${fmtMoney(equity)}</div></div>`;
  html += `<div class="agent-stat"><div class="agent-stat-label">P&L</div><div class="agent-pnl ${pnlClass(pnl)}">${pnl >= 0 ? '+' : ''}${fmtMoney(pnl)}</div></div>`;
  html += `<div class="agent-stat"><div class="agent-stat-label">Return</div><div class="agent-pnl ${pnlClass(retPct)}">${fmtPct(retPct)}</div></div>`;
  html += `</div></div>`;

  // Expanded body
  html += `<div class="agent-body">`;

  // Metrics row
  html += `<div class="agent-metrics">`;
  html += `<div class="metric"><div class="metric-label">Cash</div><div class="metric-value">${fmtMoney(cash)}</div></div>`;
  html += `<div class="metric"><div class="metric-label">Positions</div><div class="metric-value">${positions.length}</div></div>`;
  html += `<div class="metric"><div class="metric-label">Win Rate</div><div class="metric-value">${(analytics.winRate || 0).toFixed(0)}%</div></div>`;
  html += `<div class="metric"><div class="metric-label">Max DD</div><div class="metric-value">${(analytics.maxDrawdownPct || 0).toFixed(2)}%</div></div>`;
  html += `</div>`;

  // Positions table
  html += `<div class="sub-section-title">Positions</div>`;
  if (positions.length) {
    html += `<table class="mini-table"><tr><th>Symbol</th><th>Qty</th><th>Entry</th><th>Current</th><th>P&L</th></tr>`;
    positions.forEach(p => {
      const upnl = p.unrealizedPnl || 0;
      html += `<tr><td><strong>${esc(p.symbol)}</strong></td><td>${p.quantity.toFixed(6)}</td><td>$${Number(p.avgEntryPrice||0).toFixed(2)}</td><td>$${Number(p.currentPrice||p.avgEntryPrice||0).toFixed(2)}</td><td class="${pnlClass(upnl)}">${upnl>=0?'+':''}$${upnl.toFixed(2)}</td></tr>`;
    });
    html += `</table>`;
  } else {
    html += `<div style="color:var(--dim);font-size:11px;padding:8px 0">No open positions</div>`;
  }

  // Recent trades
  html += `<div class="sub-section-title">Recent Trades</div>`;
  if (trades.length) {
    html += `<table class="mini-table"><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Fill</th><th>Fee</th></tr>`;
    trades.forEach(t => {
      const time = new Date(t.created_at || t.filled_at || Date.now()).toLocaleTimeString();
      const sideClass = t.side === 'buy' ? 'positive' : 'negative';
      html += `<tr><td>${esc(time)}</td><td><strong>${esc(t.symbol)}</strong></td><td class="${sideClass}">${esc(t.side).toUpperCase()}</td><td>${Number(t.quantity||0).toFixed(6)}</td><td>$${Number(t.fill_price||0).toFixed(2)}</td><td>$${Number(t.fee||0).toFixed(2)}</td></tr>`;
    });
    html += `</table>`;
  } else {
    html += `<div style="color:var(--dim);font-size:11px;padding:8px 0">No trades yet</div>`;
  }

  // Action bar
  html += `<div class="agent-actions">`;
  html += `<button class="btn-sm" onclick="evaluateAgent('${a.id}','${esc(a.name)}')" id="btn-eval-${a.id}">▶ Evaluate</button>`;
  html += `<span style="flex:1"></span>`;
  html += `<span style="font-size:10px;color:var(--dim);align-self:center;${isActive?'':'opacity:0.5'}">${isActive?'● Active':'● Inactive'}</span>`;
  html += `</div>`;

  html += `</div></div>`;
  return html;
}

// ── Interactions ─────────────────────────────────
function toggleAgent(id) {
  expandedAgent = expandedAgent === id ? null : id;
  renderDashboard();
}

async function evaluateAgent(id, name) {
  const btn = document.getElementById('btn-eval-' + id);
  if (btn) { btn.disabled = true; btn.textContent = 'Evaluating…'; }
  try {
    const resp = await fetch(`/api/agents/${id}/evaluate`, { method: 'POST', headers: authHeaders() });
    const data = await resp.json();
    if (resp.ok) {
      toast(`${name}: ${data.signals} signals, ${data.trades} trades, P&L ${fmtMoney(data.pnlChange)}`, 'success');
      await fetchDashboard();
      expandedAgent = id;
      renderDashboard();
    } else {
      toast(`${name}: ${data.error || 'Evaluation failed'}`, 'error');
    }
  } catch (e) {
    toast(`${name}: ${e.message}`, 'error');
  }
  if (btn) { btn.disabled = false; btn.textContent = '▶ Evaluate'; }
}

async function evaluateAllAgents() {
  const btn = document.getElementById('btn-eval-all');
  btn.classList.add('btn-loading');
  const agents = dashboardData.agents || [];
  for (const d of agents) {
    if (d.agent.active) await evaluateAgent(d.agent.id, d.agent.name);
  }
  btn.classList.remove('btn-loading');
}

async function runA2ACycle() {
  const btn = document.getElementById('btn-a2a');
  btn.classList.add('btn-loading');
  btn.textContent = '⚡ Running A2A Cycle…';
  try {
    const resp = await fetch('/api/agents/a2a-cycle', { method: 'POST', headers: authHeaders() });
    const data = await resp.json();
    if (resp.ok) {
      const errs = data.errors?.length || 0;
      toast(`A2A Cycle complete: ${data.signals?.length||0} signals, ${data.validations?.length||0} validations, ${errs} errors`, errs ? 'error' : 'success');
      await fetchDashboard();
    } else {
      toast(`A2A Cycle failed: ${data.error}`, 'error');
    }
  } catch (e) {
    toast(`A2A Cycle error: ${e.message}`, 'error');
  }
  btn.classList.remove('btn-loading');
  btn.textContent = '⚡ Run A2A Cycle';
}

// ── Init ─────────────────────────────────────────
fetchDashboard();
setInterval(fetchDashboard, 10000);
</script>
</body>
</html>
